version: '3'

services:
  postgres:
    image: postgres:14.3
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file: ./backend/.env
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - '4200:80'
    env_file: ./frontend/.env.development
    depends_on:
      - backend

volumes:
  pgdata:
